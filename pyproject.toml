[project]
name = "readwise-reader-filter"
version = "0.1.0"
description = "Filter and manage Readwise Reader feed entries"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/readwise_reader_filter", "src/readwise_reader_api"]

[project.scripts]
readwise-reader-filter = "readwise_reader_filter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=7.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C90",
    "SIM",
    "UP",
]
ignore = [
    "E501",
]
